[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-extraction-api"
version = "0.1.0"
description = "Synchronous CPU/GPU-ready API skeleton for diplomatic note and applicant table extraction."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pyodbc>=5.2,<6.0",
    "pymupdf>=1.25,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]
onnx-cpu = ["onnxruntime>=1.20,<2.0"]
onnx-gpu = ["onnxruntime-gpu>=1.20,<2.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "output", "tmp", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

